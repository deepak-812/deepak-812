name: Profile ETL Pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6 AM UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  extract-transform-load:
    runs-on: ubuntu-latest
    env:
      GH_USER: deepak-812
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- EXTRACT ----------
      - name: Extract raw data from GitHub API
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$GH_USER" -o user_raw.json

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$GH_USER/repos?per_page=100" -o repos_raw.json

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$GH_USER/events/public?per_page=100" -o events_raw.json

      # ---------- TRANSFORM ----------
      - name: Transform raw data into pipeline metrics
        run: |
          python3 << 'PYEOF'
          import json
          from datetime import datetime, timezone

          with open("user_raw.json") as f:
              user = json.load(f)
          with open("repos_raw.json") as f:
              repos = json.load(f)
          with open("events_raw.json") as f:
              events = json.load(f)

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          total_stars = sum(r.get("stargazers_count", 0) for r in repos) if isinstance(repos, list) else 0
          events_today = len(events) if isinstance(events, list) else 0
          languages = sorted({r.get("language") for r in repos if isinstance(repos, list) and r.get("language")}) if isinstance(repos, list) else []

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          records_processed = public_repos + followers + total_stars + events_today

          metrics = {
              "status": "SUCCESS",
              "last_run": now,
              "public_repos": public_repos,
              "followers": followers,
              "total_stars": total_stars,
              "events_last_90d": events_today,
              "languages_detected": ", ".join(languages) if languages else "none yet",
              "records_processed": records_processed,
          }

          with open("metrics.json", "w") as f:
              json.dump(metrics, f)
          PYEOF

      # ---------- LOAD ----------
      - name: Load transformed metrics into README
        run: |
          python3 << 'PYEOF'
          import json
          import re

          with open("metrics.json") as f:
              m = json.load(f)

          block = f"""```yaml
          pipeline: github-profile-etl
          status: {m['status']}
          last_run: {m['last_run']}
          extract: GitHub API -> repos, followers, activity
          transform: aggregate + compute freshness metrics
          load: this README
          public_repos: {m['public_repos']}
          followers: {m['followers']}
          total_stars: {m['total_stars']}
          languages_detected: {m['languages_detected']}
          records_processed: {m['records_processed']}
          next_run: daily @ 06:00 UTC
          ```"""

          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          new_section = f"<!--START_SECTION:pipeline-->\n\n{block}\n\n<!--END_SECTION:pipeline-->"

          text = re.sub(
              r"<!--START_SECTION:pipeline-->.*?<!--END_SECTION:pipeline-->",
              new_section,
              text,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh pipeline metrics"
          git push
