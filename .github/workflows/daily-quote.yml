name: Daily Dev Quote

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6 AM UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch a fresh quote and update README
        run: |
          RESPONSE=$(curl -s "https://api.quotable.io/random?tags=technology|inspirational|success")
          CONTENT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('content','Build things that outlast the hype.'))")
          AUTHOR=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('author','Unknown'))")

          python3 - <<PYEOF
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          new_block = '<!--START_SECTION:quote-->\n*"$CONTENT"* — **$AUTHOR**\n<!--END_SECTION:quote-->'
          text = re.sub(
              r"<!--START_SECTION:quote-->.*?<!--END_SECTION:quote-->",
              new_block,
              text,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh daily quote"
          git push
